<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: blanchedalmond;
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .con{
            height: 100vh;
        }
        .top{
            height: 40%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            background-color: blanchedalmond;
        }
        .bottom{
            height: 60%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            background-color: blanchedalmond;
        }
        .box-move{
            height: 70%;
            width: 25%;
            border: 2px dotted black ;
        }
        .box{
            height: 30%;
            width: 30%;
            background-color: brown;
            animation-name: name;
            animation-duration: 3s;
            animation-iteration-count: infinite;
        }
        @keyframes name{
            0%{
                transform: translate(0,0);
            }
            25%{
                transform: translate(252px,0);
            }
            50%{
                transform: translate(252px,242px);
            }
            75%{
                transform: translate(0,242px);
            }
            100%{
                transform: translate(0,0);
            }
        }
        .google{
            height: 70%;
            width: 25%;
            border: 2px dotted black ;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1%;
        }
        .circle{
            height: 17%;
            width: 15%;
            /* border: 1px solid black; */
            border-radius: 50%;
            animation-name:google ;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
        }
        @keyframes google{
        
            0%{
                transform: translate(0);

            }
            50%{
                transform: translate(0,-35px);
            }
             
            100%{
                transform: translate(0);
            }
        }
        .c1{
            background-color: red;
           
        }
        .c2{
            background-color: orange;
            animation-delay: 0.1s;
        }
        .c3{
            background-color: yellow;
            animation-delay: 0.3s;
        }
        .c4{
            background-color: green;
            animation-delay: 0.5s;
        }
        .c5{
            background-color: blue;
            animation-delay: 0.7s;
        }
        .square{
            border-radius: 10px;
            height: 100px;
            width: 100px;
            color: white;
            text-align: center;
            line-height: 100px;
            border: 1px solid black;
            animation-duration: 3s;
            animation-iteration-count: infinite;
        }
        .s1{
            background-color: red;
            animation-name: color;
        }
        @keyframes color{
            from,to{
                background-color: red;
            }
            50%{
                background-color: blue;
            }
        }
        .s2{
            background-color: blueviolet;
            animation-name: move;
        }
        @keyframes move {
            0%{
                transform: translate(0);

            }
            50%{
                transform: translate(0,50px);
            }
            100%{
                transform: translate(0);
            }
        }
        .s3{
            background-color: darkgreen;
            animation-name: rotate;
        }
        @keyframes rotate{
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
        .s4{
            background-color: orange;
            animation-name: pulse;
        }
        @keyframes pulse{
            0%{
                transform: scale(1);
            }
            50%{
                transform: scale(1.5);
            }
            100%{
                transform: scale(1);
            }
        }
        .s5{
            background-color: gray;
            animation-name: fade;
        }
        @keyframes fade{
            0%{
                opacity: 1;
            }
            50%{
                opacity: 0;
            }
            100%{
                opacity: 1;
            }
        }
        .s6{
            border: 10px solid lightgray;
            border-top: 10px solid blue;
            border-radius: 50%;
            animation-name: rotate;
        }
        .s7{
            height: 80px;
            width: 80px;
            background-color: green;
        }
    </style>
</head>
<body>
    <div class="con">
        <h1 align="center">CSS Animation Examples</h1>
        <div class="top">
        <div class="square s1">Color</div>
        <div class="square s2">Move</div>
        <div class="square s3">Rotate</div>
        <div class="square s4">Pulse</div>
        <div class="square s5">Fade</div>
        <div class="square s6">Spin</div>
        </div>
        <div class="bottom">
        <div class="box-move">
            <div class="box"></div>
        </div>
        <div class="google">
            <div class="circle c1"></div>
            <div class="circle c2"></div>
            <div class="circle c3"></div>
            <div class="circle c4"></div>
            <div class="circle c5"></div>
        </div>
        
    </div>
    </div>
    
</body>
</html>
